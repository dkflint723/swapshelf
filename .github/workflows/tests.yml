name: Tests

# The distribute workflow only runs on version tags, so until now nothing verified a change until
# release time. This runs the suites on every push and pull request instead.
on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: windows-2025

    steps:
    - name: Checkout repository
      uses: actions/checkout@v7

    - name: Setup .NET 10.0
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: '10.0.202'

    - name: Display .NET Info
      run: dotnet --info

    # Before anything is built. A dependency with a published vulnerability fails the run here, with
    # the package named, rather than shipping in the next release. Transitive packages included -
    # the one that bites is rarely the one that was asked for.
    - name: Check for vulnerable packages
      shell: pwsh
      run: |
        dotnet restore "DLSS Swapper.sln"
        $report = dotnet list "DLSS Swapper.sln" package --vulnerable --include-transitive 2>&1 | Out-String
        Write-Output $report
        if ($report -match 'has the following vulnerable packages') {
          Write-Error 'A referenced package has a known vulnerability. See the report above.'
          exit 1
        }

    # Pure net10.0 with no Windows App SDK dependency, so it runs in seconds. Kept as its own step
    # so a core rule breaking is reported as that, rather than being buried in an app build.
    - name: Run core tests
      run: dotnet test "tests/DLSS.Swapper.Core.Tests/DLSS.Swapper.Core.Tests.csproj" -c Debug --logger "console;verbosity=normal"

    # Builds the WinUI app, since these tests exercise its types directly. Slower than the core
    # suite by some minutes, which is why it runs second.
    - name: Run app tests
      run: dotnet test "tests/DLSS.Swapper.App.Tests/DLSS.Swapper.App.Tests.csproj" -c Debug --logger "console;verbosity=normal"
